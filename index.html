<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piper Voice Lab v0.5</title><style>body{font:16px system-ui;margin:20px auto;padding:0 16px;max-width:720px;background:#f6f8fb;color:#172238}textarea,select,button,audio{display:block;width:100%;box-sizing:border-box;margin:10px 0;padding:12px;border:1px solid #aab7c8;border-radius:10px;font:inherit}button{background:#245bd5;color:white;font-weight:bold}button:disabled{opacity:.5}pre{background:white;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto;font-size:12px}</style></head><body><h2>Piper Browser Voice Lab v0.5</h2><p>Тест без платного API. Сборка с единым ONNX Runtime. TELC B1 Trainer не изменяется.</p><label>Немецкий текст<textarea id="text" rows="4">Guten Morgen! Ich heiße Eva und wohne in München. Heute möchte ich einen Termin vereinbaren.</textarea></label><label>Голос<select id="voice"><option value="de_DE-eva_k-x_low">Eva K — женский</option><option value="de_DE-kerstin-low">Kerstin — женский</option><option value="de_DE-thorsten-medium">Thorsten — мужской</option><option value="de_DE-thorsten-high">Thorsten High — мужской (тот же диктор)</option></select></label><button id="check">1. Проверить ONNX</button><button id="generate">2. Сгенерировать речь</button><audio id="player" controls></audio><p id="status">Готов к проверке.</p><button id="copy">Скопировать диагностику</button><pre id="log"></pre><script type="module" src="/src/main.js"></script></body></html>
